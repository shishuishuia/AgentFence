[workspace]
members = ["crates/core", "crates/server", "crates/mcp-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
agentfence-core = { path = "crates/core" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
getrandom = "0.3"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

