name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo build --workspace --release --locked
      - name: Lint isolated HTTP experiment
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test isolated HTTP experiment
        run: cargo test --workspace --all-features --locked
      - name: Build isolated HTTP experiment
        run: cargo build --release --locked -p agentfence-server --features bench-harness --example http_experiment
