name: Dashboard checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - run: cargo build --release --locked -p agentfence-server
      - run: npm --prefix front ci
      - run: npm --prefix front run lint
      - run: npm --prefix front run test:unit
      - run: npm --prefix front run build
      - run: python -m unittest discover -s integrations/tests -v
      - run: python -m unittest discover -s web_proxy/tests -v
      - run: python -m unittest discover -s demo/tests -v
      - run: python -m demo.run_minimal
      - run: python -m demo.run_dashboard --mode dist --auto --step-delay 0 --hold-seconds 0
      - name: Run all 34 independent HTTP security cases
        run: python -m demo.e2e_cases --results-dir results/local-blackbox-ci
      - name: Upload sanitized black-box evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-${{ github.sha }}-ubuntu
          path: results/local-blackbox-ci/local-e2e-*/public/
          if-no-files-found: warn
      - name: Build shared Rust HTTP experiment
        run: cargo build --release --locked -p agentfence-server --features bench-harness --example http_experiment
      - name: Test paired HTTP sampling and evidence verification
        run: python -m unittest discover -s bench/tests -v
      - name: Collect three-round paired HTTP benchmark
        run: python -m bench.run_bench --results-dir results/local-bench-ci
      - name: Upload sanitized HTTP benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-benchmark-${{ github.sha }}-ubuntu
          path: results/local-bench-ci/local-bench-*/public/
          if-no-files-found: warn
