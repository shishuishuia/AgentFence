name: V2 B integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  readonly-mcp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AGENTFENCE_V2_BIN_DIR: target/release
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - run: cargo build --workspace --release --locked
      - run: python -m pip install -r integrations/requirements-mcp.txt
      - run: python -m unittest integrations.tests.test_mcp_review -v
      - run: python -m unittest discover -s web_proxy/tests -v
      - run: python -m demo.run_v2_acceptance --bin-dir target/release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-b-${{ matrix.os }}-${{ github.sha }}
          path: |
            results/local-v2-b-*/evidence.json
            results/local-v2-b-*/manifest.json
            results/local-v2-b-*/fixture/audit.jsonl
          if-no-files-found: warn
